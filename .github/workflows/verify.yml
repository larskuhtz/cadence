# Re-verify the development against the sources in this commit.
#
# Two independent jobs, run in parallel on separate runners:
#
#   verify — pulls the published `cadence-verified` image and re-runs the
#            staged verification against the checked-out sources (tier 2a of
#            the audit ladder, docs/Container.md §4), then the conformance
#            monitor. This is the cheap per-commit gate: it does NOT build
#            the world.
#   check  — kernel-replays every proof STORED in that same image through
#            `leanchecker` (tier 1). Off the critical path: `verify` is
#            always the longer job, so this adds no wall time.
#
# The two compose into "every declaration this commit relies on has been
# kernel-checked": `verify` trusts the image's oleans for modules whose
# sources are unchanged — that trust rests on lake's source-hash bookkeeping,
# not on the kernel — and re-elaborates (hence kernel-checks, via `addDecl`)
# everything else; `check` closes the first half by replaying the stored side.
# A module added since the image was published has no stored olean: `check`
# skips it loudly, and it falls in `verify`'s re-elaborated half.
#
# A failed verification condition, a missing proof, a drifted axiom pin, a
# broken `#guard_msgs`, or a stored declaration the kernel rejects fails the
# run.
#
# Cheap for the common commit because the image's oleans already match the
# sources and nothing re-elaborates. A commit that touches a model or a proof
# file re-solves the affected VCs COLD — the `verified` image deliberately
# ships no proof cache — and that is a feature, not an omission: it
# re-exercises the whole derivation path, including the manual `#prove_vc`
# tactics that a warm cache would consume without elaborating (the
# cache-discipline rule in CLAUDE.md § Build). The job timeout and BATCH=1
# below are sized for those rare cold runs; after merging one, run
# `publish-images.yml` so the published oleans catch up and the gate is cheap
# again.
#
# Requires the images to exist: run `publish-images.yml` once (with
# `rebuild_deps: true`) before this workflow can pass. See docs/Images.md.
name: verify

on:
  # Only the default branch on push; every other branch is covered by its pull
  # request, so this does not run twice for the same commit.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: read the repository, read the published image. Nothing here
# writes anything. A pull request from a fork gets a read-only token, which is
# sufficient, and no secret is needed at all while the packages are public.
permissions:
  contents: read
  packages: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  # Derived from the repository owner, never from attacker-controllable event
  # data such as a branch name or pull-request title.
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cadence

# Runner architecture: arm64. The published images are dual-architecture
# manifest lists (publish-images.yml builds each arch natively and combines
# them), so the pull below resolves to the arm64 entry — matching the images
# built locally on Apple Silicon, which is what lets a failure here be
# reproduced on the maintainer's machine. One architecture suffices for this
# gate: the proofs are architecture-independent, and the amd64 image runs the
# same staged verification inside its own build before it can be published.

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    # Sized for a cold run (model or proof files touched): the whole suite
    # re-solves at 4 CPUs with the proof files built one at a time. A warm
    # run finishes in a fraction of this.
    timeout-minutes: 180

    steps:
      # The runner ships with ~14 GB free and this job needs roughly 25 GB: the
      # image (13.1 GB on disk) plus the named volume, which the runtime
      # initialises with a copy of the image's `.lake`. Reclaim the preinstalled
      # toolchains inline rather than via a third-party action — it is a handful
      # of paths, and it keeps the supply chain to first-party actions only.
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          echo "free before:${before} after:$(df --output=avail -BG / | tail -1)"
          df -h /

      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here uses git credentials; leaving them in .git/config for
          # the rest of the job would be a needless token exposure.
          persist-credentials: false

      # Authenticating even for public packages avoids anonymous pull limits.
      # The token reaches docker on stdin via the environment, so it is never an
      # argument (visible in `ps`) and never interpolated into the script body.
      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printenv REGISTRY_TOKEN \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      # `scripts/container.sh` resolves the image by its local tag and derives
      # the volume name from it, so retag rather than pointing IMAGE at a
      # registry path — that contains `/` and `:`, which is not a legal volume
      # name.
      - name: Pull the verified image
        run: |
          set -euo pipefail
          if ! docker pull "${IMAGE_BASE}-verified:latest"; then
            # Deliberately fatal rather than skipped: a verification gate that
            # passes when it could not verify anything is worse than a red run.
            echo "::error::cannot pull ${IMAGE_BASE}-verified:latest — run the" \
                 "publish-images workflow first (its images are what this job" \
                 "verifies against), and check the package is readable by this" \
                 "repository."
            exit 1
          fi
          docker tag "${IMAGE_BASE}-verified:latest" cadence-verified
          docker image inspect cadence-verified \
            --format 'pulled {{index .RepoDigests 0}}'

      # CPUS/MEMORY must fit the runner: the script's defaults (12 CPUs, 20 GB)
      # are sized for a workstation. Memory is set below physical so the
      # container hits its own limit rather than the kernel OOM killer.
      # BATCH=1 because this is a 4-core machine: at the default batch of 6,
      # concurrent dischargers contend for wall-clock and near-limit VCs time
      # out spuriously (measured — see scripts/revalidate.sh's header), and
      # the marker assertion below rightly treats any ⏱ as a failure.
      - name: Re-verify against these sources
        env:
          RUNTIME: docker
          CPUS: '4'
          MEMORY: 13G
          BATCH: '1'
        run: |
          set -euo pipefail
          scripts/container.sh verify 2>&1 | tee verify.log

      # Defence in depth. The script already exits non-zero on a failed stage,
      # but this project's rule is to count all four markers: grepping only for
      # ❌ hides timeouts and solver crashes. A `sorry` reaching a Cadence
      # module would be a silent regression of the trust base.
      - name: Assert the verification markers
        run: |
          set -euo pipefail
          fail=0
          for m in '❌' '💥' '⏱'; do
            n=$(grep -c -- "$m" verify.log || true)
            if [ "$n" != 0 ]; then
              echo "::error::found $n occurrence(s) of $m"; fail=1
            fi
          done
          if grep -nE 'Cadence/.*declaration uses .sorry.' verify.log; then
            echo "::error::a Cadence module depends on sorry"; fail=1
          fi
          if ! grep -q 'ALL STAGES GREEN' verify.log; then
            echo "::error::the staged verification did not report ALL STAGES GREEN"
            fail=1
          fi
          printf 'proven   %s\nreplayed %s\n' \
            "$(grep -c -- '✅' verify.log || true)" \
            "$(grep -c -- '♻'  verify.log || true)"
          exit "$fail"

      # The model-conformance monitor (docs/Monitor.md). Not part of any
      # theorem's trust base — but the fixture run doubles as the build's
      # non-vacuity witness for Chorus, which cannot carry an in-build
      # `sat trace` (docs/TODO.md § Soundness has the record). Reuses the
      # volume the verify step above just refreshed, so the oleans match
      # these sources.
      - name: Run the model-conformance monitor
        env:
          RUNTIME: docker
          CPUS: '4'
          MEMORY: 13G
        run: |
          set -euo pipefail
          scripts/container.sh monitor 2>&1 | tee monitor.log

      - name: Upload the verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-log-${{ github.run_id }}
          path: |
            verify.log
            monitor.log
          retention-days: 14

  # Tier 1 of the audit ladder (docs/Container.md §4): replay every stored
  # proof in the published image through the kernel — no solver, no tactics,
  # no elaboration. No `needs:` on purpose — it runs concurrently with
  # `verify` on its own runner; the header comment carries the composition
  # argument for why checking the IMAGE's oleans (not the ones `verify`
  # rebuilds) is the semantically right half of the pair.
  check:
    runs-on: ubuntu-24.04-arm
    # Pull (~4 GiB) + volume seeding + leanchecker itself (~4–8 min depending
    # on threads). Generous because a hung pull should fail loudly, not eat
    # the verify job's budget.
    timeout-minutes: 45

    steps:
      # Same arithmetic as the verify job: the runner ships with ~14 GB free,
      # and the image plus the volume copy of its `.lake` need roughly 25 GB.
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          echo "free before:${before} after:$(df --output=avail -BG / | tail -1)"
          df -h /

      # The checkout supplies `scripts/container.sh` and the source tree the
      # module list is computed from; the proofs being checked come from the
      # image.
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printenv REGISTRY_TOKEN \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      # The digest in the log records exactly which image this run's claim is
      # about — an anchor of unclear provenance is worth nothing at tier 1.
      - name: Pull the verified image
        run: |
          set -euo pipefail
          if ! docker pull "${IMAGE_BASE}-verified:latest"; then
            echo "::error::cannot pull ${IMAGE_BASE}-verified:latest — run the" \
                 "publish-images workflow first, and check the package is" \
                 "readable by this repository."
            exit 1
          fi
          docker tag "${IMAGE_BASE}-verified:latest" cadence-verified
          docker image inspect cadence-verified \
            --format 'pulled {{index .RepoDigests 0}}'

      # LEAN_NUM_THREADS=3, not the script's default 4: leanchecker peaks at
      # ~12.9 GB with 4 worker threads (measured — scripts/container.sh has
      # the numbers), which leaves no headroom under a 13 GB container limit
      # on this 16 GB runner. Three threads trades a couple of minutes — free,
      # since this job is off the critical path — for not being OOM-flaky.
      - name: Kernel-replay the stored proofs
        env:
          RUNTIME: docker
          CPUS: '4'
          MEMORY: 13G
          LEAN_NUM_THREADS: '3'
        run: |
          set -euo pipefail
          scripts/container.sh check 2>&1 | tee check.log

      # Defence in depth, mirroring the verify job: the script exits non-zero
      # on failure, but a gate should also assert the positive signal it
      # exists to produce.
      - name: Assert the kernel replay
        run: |
          set -euo pipefail
          grep -q 'every stored declaration re-checked by the kernel' check.log

      - name: Upload the check log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-log-${{ github.run_id }}
          path: check.log
          retention-days: 14
