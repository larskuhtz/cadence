# Re-verify the development against the sources in this commit.
#
# Two independent jobs, run in parallel on separate runners:
#
#   verify — pulls the published `cadence-verified-cache` image (the
#            `verified` image plus its proof cache; `verified` itself in a
#            cold run) and re-runs the staged verification against the
#            checked-out sources (tier 2a of the audit ladder,
#            docs/Container.md §4), then the conformance monitor. This is the
#            cheap per-commit gate: it does NOT build the world.
#   check  — kernel-replays every proof STORED in the `verified` image (whose
#            oleans `verified-cache` shares) through
#            `leanchecker` (tier 1). Off the critical path: `verify` is
#            always the longer job, so this adds no wall time.
#
# The two compose into "every declaration this commit relies on has been
# kernel-checked": `verify` trusts the image's oleans for modules whose
# sources are unchanged — that trust rests on lake's source-hash bookkeeping,
# not on the kernel — and re-elaborates (hence kernel-checks, via `addDecl`)
# everything else; `check` closes the first half by replaying the stored side.
# A module added since the image was published has no stored olean: `check`
# skips it loudly, and it falls in `verify`'s re-elaborated half.
#
# A failed verification condition, a missing proof, a drifted axiom pin, a
# broken `#guard_msgs`, or a stored declaration the kernel rejects fails the
# run.
#
# Cheap for the common commit because the image's oleans already match the
# sources and nothing re-elaborates. A commit that touches a model or a proof
# file re-elaborates the affected modules, and how their VCs are discharged
# depends on the proof-cache mode:
#
#   primed (the default) — this job publishes nothing, so it runs against
#            `cadence-verified-cache`: the `verified` image plus the Veil proof
#            cache its own publish build produced. A pull request also
#            restores, from the Actions cache, the entries its own earlier
#            runs solved, and saves the new ones afterwards (scoped to that
#            pull request; the default branch never reads or writes the
#            Actions cache). A cell whose statement and the definitions it
#            names are unchanged replays its stored proof: a comment edit, a
#            Veil re-pin on the same toolchain, an action edit outside that
#            action's cells, a second push to a pull request. A cell whose
#            statement or definitions changed — every cell of a family after
#            an invariant, assumption or contract change — misses (its stored
#            proof fails the re-check, or there is none) and is solved cold,
#            here as anywhere; so does every cell after a toolchain bump.
#   cold   — `workflow_dispatch` with `proof_cache: cold`: the `verified`
#            image, which ships no cache, so every re-elaborated cell is
#            solved by cvc5 (or the cheap rung) from scratch.
#
# Priming changes no claim: every cache hit is re-checked by the kernel
# against the live goal before anything depends on it (CLAUDE.md § Build). What
# a primed run gives up is re-exercising the proof SEARCH, including the manual
# `#prove_vc` tactics a hit consumes without elaborating — the derivation drift
# that the cache-discipline rule in CLAUDE.md § Build warns about. That risk is
# accepted here (Lars, 2026-10-03) because the image publish keeps exercising
# search: publish-images.yml never reads the Actions cache, and its seed is
# only the previous publish build's own cache, whose entries Veil deletes 14
# days after they were solved (hits do not refresh them; the sweep runs at a
# build's first store) — so a stored proof is re-searched about that often,
# and a primed run never sees an entry a pull request made. Dispatch a
# cold run to exercise a statement-preserving edit's derivation on demand.
# Each run says which mode it used, in the log and the job summary, with the
# proof-cache hits and stores of the modules it re-elaborated.
#
# The job timeout and JOBS=2 below are sized for a cold run; after merging one,
# `publish-images.yml` brings the published oleans up to date and the gate is
# cheap again.
#
# Requires the images to exist: run `publish-images.yml` once (with
# `rebuild_deps: true`) before this workflow can pass. See docs/Images.md.
name: verify

on:
  # Only the default branch on push; every other branch is covered by its pull
  # request, so this does not run twice for the same commit.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      proof_cache:
        description: 'primed: start from the published proof cache; cold: solve every re-elaborated cell'
        type: choice
        options: [primed, cold]
        default: primed

# Least privilege: read the repository, read the published image. The token
# writes nothing; the one thing a run writes is a pull request's proof-cache
# delta to the Actions cache, which needs no token permission and is visible
# only to that pull request's own runs. A pull request from a fork gets a
# read-only token, which is sufficient, and no secret is needed at all while
# the packages are public.
permissions:
  contents: read
  packages: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  # Derived from the repository owner, never from attacker-controllable event
  # data such as a branch name or pull-request title.
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cadence

# Runner architecture: arm64. The published images are dual-architecture
# manifest lists (publish-images.yml builds each arch natively and combines
# them), so the pull below resolves to the arm64 entry — matching the images
# built locally on Apple Silicon, which is what lets a failure here be
# reproduced on the maintainer's machine. One architecture suffices for this
# gate: the proofs are architecture-independent, and the amd64 image runs the
# same staged verification inside its own build before it can be published.

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    # Sized for a cold run (model or proof files touched): the whole suite
    # re-solves at 4 CPUs with the proof files built one at a time. A warm
    # run finishes in a fraction of this.
    timeout-minutes: 180

    steps:
      # The runner ships with ~14 GB free and this job needs roughly 25 GB: the
      # image (13.1 GB on disk) plus the named volume, which the runtime
      # initialises with a copy of the image's `.lake` — ~10 GB more in a primed
      # run, whose image and volume both carry the proof cache. Reclaim the preinstalled
      # toolchains inline rather than via a third-party action — it is a handful
      # of paths, and it keeps the supply chain to first-party actions only.
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          echo "free before:${before} after:$(df --output=avail -BG / | tail -1)"
          df -h /

      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here uses git credentials; leaving them in .git/config for
          # the rest of the job would be a needless token exposure.
          persist-credentials: false

      # Authenticating even for public packages avoids anonymous pull limits.
      # The token reaches docker on stdin via the environment, so it is never an
      # argument (visible in `ps`) and never interpolated into the script body.
      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printenv REGISTRY_TOKEN \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      # The proof-cache mode (header). Event data is read through the
      # environment, never interpolated into the script body.
      - name: Choose the proof-cache mode
        id: mode
        env:
          REQUESTED: ${{ inputs.proof_cache }}
        run: |
          set -euo pipefail
          if [ "${REQUESTED:-primed}" = cold ]; then
            echo 'mode=cold'            >> "$GITHUB_OUTPUT"
            echo 'image=verified'       >> "$GITHUB_OUTPUT"
          else
            echo 'mode=primed'          >> "$GITHUB_OUTPUT"
            echo 'image=verified-cache' >> "$GITHUB_OUTPUT"
          fi

      # `scripts/container.sh` resolves the image by its local tag and derives
      # the volume name from it, so retag rather than pointing IMAGE at a
      # registry path — that contains `/` and `:`, which is not a legal volume
      # name. `verified-cache` is `verified` plus one layer holding the proof
      # cache (Containerfile), built in the same publish run, so its oleans are
      # the `verified` image's; the extra layer is ~1.9 GB compressed.
      - name: Pull the image
        env:
          IMG: ${{ steps.mode.outputs.image }}
        run: |
          set -euo pipefail
          if ! docker pull "${IMAGE_BASE}-${IMG}:latest"; then
            # Deliberately fatal rather than skipped: a verification gate that
            # passes when it could not verify anything is worse than a red run.
            echo "::error::cannot pull ${IMAGE_BASE}-${IMG}:latest — run the" \
                 "publish-images workflow first (its images are what this job" \
                 "verifies against), and check the package is readable by this" \
                 "repository."
            exit 1
          fi
          docker tag "${IMAGE_BASE}-${IMG}:latest" "cadence-${IMG}"
          docker image inspect "cadence-${IMG}" \
            --format 'pulled {{index .RepoDigests 0}}'

      # A pull request's own earlier runs: the entries they solved that the
      # image does not hold. The key never matches exactly (it names this run),
      # so the restore takes the newest entry for this pull request. Caches made
      # on a pull request's ref are visible to that pull request only.
      - name: Restore this pull request's proof-cache delta
        if: steps.mode.outputs.mode == 'primed' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/veilcache-delta
          key: veilcache-pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: veilcache-pr${{ github.event.pull_request.number }}-

      # Create the volume now rather than in container.sh, so the delta can go
      # in before the verification starts. Its first mount initialises it from
      # the image's `.lake` — the oleans, the dependency tree, and the image's
      # cache — exactly as container.sh's own first mount would. A delta entry
      # replaces an image entry of the same name. The name is the statement's
      # hash, and a statement names the model's definitions (`Invariants`,
      # `Assumptions`) rather than spelling them out, so a model edit keeps the
      # name while the stored proof stops checking: the hit's re-check fails,
      # the cell is solved again and stored under the old name (the first PR
      # run, after an Mvba assumption was removed: 290 such stores, no new
      # names). That re-solved entry is the one this pull request needs. The
      # stamp marks the priming time for the export below.
      - name: Prime the proof cache
        if: steps.mode.outputs.mode == 'primed'
        env:
          DELTA: ${{ runner.temp }}/veilcache-delta
        run: |
          set -euo pipefail
          mkdir -p "$DELTA"
          docker volume create cadence-lake-verified-cache >/dev/null
          docker run --rm \
            -v cadence-lake-verified-cache:/workspaces/cadence/.lake \
            -v "$DELTA":/delta:ro \
            cadence-verified-cache bash -c '
              set -euo pipefail
              c=/workspaces/cadence/.lake/build/veilcache
              mkdir -p "$c"
              img=$(find "$c" -name "*.vpc" | wc -l)
              cp -p /delta/*.vpc "$c"/ 2>/dev/null || true
              touch /workspaces/cadence/.lake/build/veilcache-primed.stamp
              echo "image=$img"
              echo "delta=$(find /delta -name "*.vpc" | wc -l)"
              echo "size=$(du -sh "$c" | cut -f1)"' | tee prime.txt
          img=$(sed -n 's/^image=//p' prime.txt)
          delta=$(sed -n 's/^delta=//p' prime.txt)
          echo "proof cache: PRIMED — ${img} entries from the image, ${delta} from" \
               "this pull request's earlier runs ($(sed -n 's/^size=//p' prime.txt))"

      # CPUS/MEMORY must fit the runner: the script's defaults (12 CPUs, 20 GB)
      # are sized for a workstation. Memory is set below physical so the
      # container hits its own limit rather than the kernel OOM killer.
      # JOBS=2 because this is a 4-core machine: one `lake build` with two
      # `lean` processes of two threads each. Wider settings make concurrent
      # dischargers contend for wall-clock and near-limit VCs time out spuriously, which
      # the marker assertion below rightly treats as a failure. JOBS=2 beat
      # the staged BATCH=1 and BATCH=2 on a cold Chorus run with a lower
      # slowest cell (measured — see scripts/revalidate.sh's header).
      - name: Re-verify against these sources
        env:
          RUNTIME: docker
          IMAGE: cadence-${{ steps.mode.outputs.image }}
          CPUS: '4'
          MEMORY: 13G
          JOBS: '2'
        run: |
          set -euo pipefail
          scripts/container.sh verify 2>&1 | tee verify.log

      # Defence in depth. The script already exits non-zero on a failed stage,
      # but this project's rule is to count all four markers: grepping only for
      # ❌ hides timeouts and solver crashes. A `sorry` reaching a Cadence
      # module would be a silent regression of the trust base.
      - name: Assert the verification markers
        run: |
          set -euo pipefail
          fail=0
          for m in '❌' '💥' '⏱'; do
            n=$(grep -c -- "$m" verify.log || true)
            if [ "$n" != 0 ]; then
              echo "::error::found $n occurrence(s) of $m"; fail=1
            fi
          done
          if grep -nE 'Cadence/.*declaration uses .sorry.' verify.log; then
            echo "::error::a Cadence module depends on sorry"; fail=1
          fi
          if ! grep -q 'ALL STAGES GREEN' verify.log; then
            echo "::error::the staged verification did not report ALL STAGES GREEN"
            fail=1
          fi
          printf 'proven   %s\nreplayed %s\n' \
            "$(grep -c -- '✅' verify.log || true)" \
            "$(grep -c -- '♻'  verify.log || true)"
          exit "$fail"

      # Which mode this run used, and what the cache did for it. Counted over
      # the modules this run BUILT: lake also replays the stored log of every
      # module the image already had, and those carry their own (old) ♻
      # summaries, so a whole-log count says nothing about this run. Each
      # built module that touched the cache prints one line, "♻ proof cache
      # (…): N hits (…), M stored."
      - name: Report the proof-cache mode
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          [ -f verify.log ] || exit 0
          read -r built hits stored < <(awk '
            /\] Built /    { s = 1; b++ }
            /\] Replayed / { s = 0 }
            /=== STAGE/    { s = 0 }
            /♻ proof cache \(/ && s {
              for (i = 2; i <= NF; i++) {
                if ($i == "hits")    h += $(i-1)
                if ($i == "stored.") t += $(i-1)
              } }
            END { printf "%d %d %d\n", b, h, t }' verify.log)
          line="proof cache: ${MODE^^} — ${built} modules built, ${hits} hits, ${stored} solved and stored"
          if [ "$MODE" = primed ] && [ -f prime.txt ]; then
            img=$(sed -n 's/^image=//p' prime.txt)
            delta=$(sed -n 's/^delta=//p' prime.txt)
            line="$line (primed with ${img} image + ${delta} pull-request entries)"
          fi
          echo "$line"
          echo "::notice title=proof cache::$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # The model-conformance monitor (docs/Monitor.md). Not part of any
      # theorem's trust base — but the fixture run doubles as the build's
      # non-vacuity witness for Chorus, which cannot carry an in-build
      # `sat trace` (docs/TODO.md § Soundness has the record). Reuses the
      # volume the verify step above just refreshed, so the oleans match
      # these sources.
      - name: Run the model-conformance monitor
        env:
          RUNTIME: docker
          IMAGE: cadence-${{ steps.mode.outputs.image }}
          CPUS: '4'
          MEMORY: 13G
        run: |
          set -euo pipefail
          scripts/container.sh monitor 2>&1 | tee monitor.log

      # Save what this run solved beyond the image's cache, for this pull
      # request's next run — also after a failed verification, whose solved
      # cells are exactly what the next push wants. The delta is every volume
      # entry the image does not hold under that name (the image's directory is
      # visible at its usual path because the volume is mounted elsewhere) or
      # that was written after priming, so it carries the restored entries
      # forward too. Saved only when it changed: Actions cache entries are
      # immutable, and an unchanged delta is already stored.
      - name: Export this pull request's proof-cache delta
        id: delta
        if: >-
          !cancelled()
          && steps.mode.outputs.mode == 'primed'
          && github.event_name == 'pull_request'
        env:
          OUT: ${{ runner.temp }}/veilcache-out
          DELTA: ${{ runner.temp }}/veilcache-delta
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          docker run --rm \
            -v cadence-lake-verified-cache:/vol:ro \
            -v "$OUT":/out \
            cadence-verified-cache bash -c '
              set -euo pipefail
              shopt -s nullglob
              cd /vol/build/veilcache
              new=0
              for f in *.vpc; do
                if [ "$f" -nt /vol/build/veilcache-primed.stamp ]; then
                  cp -p "$f" /out/; new=$((new + 1))
                elif [ ! -e "/workspaces/cadence/.lake/build/veilcache/$f" ]; then
                  cp -p "$f" /out/
                fi
              done
              echo "new=$new"' | tee export.txt
          n=$(find "$OUT" -name '*.vpc' | wc -l)
          new=$(sed -n 's/^new=//p' export.txt)
          echo "delta: $n entries ($(du -sh "$OUT" | cut -f1)), $new new in this run"
          # Save from the restore path: the Actions cache versions an entry by
          # its path, so a save from anywhere else would never be restored.
          rm -rf "$DELTA" && mv "$OUT" "$DELTA"
          [ "$new" -gt 0 ] && echo 'save=true' >> "$GITHUB_OUTPUT" || true

      - name: Save this pull request's proof-cache delta
        if: steps.delta.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/veilcache-delta
          key: veilcache-pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-log-${{ github.run_id }}
          path: |
            verify.log
            monitor.log
          retention-days: 14

  # Tier 1 of the audit ladder (docs/Container.md §4): replay every stored
  # proof in the published image through the kernel — no solver, no tactics,
  # no elaboration. No `needs:` on purpose — it runs concurrently with
  # `verify` on its own runner; the header comment carries the composition
  # argument for why checking the IMAGE's oleans (not the ones `verify`
  # rebuilds) is the semantically right half of the pair.
  check:
    runs-on: ubuntu-24.04-arm
    # Pull (~4 GiB) + volume seeding + leanchecker itself — measured 12m44s
    # end to end on this runner (9m31s of it leanchecker at 3 threads), inside
    # the verify job's ~16 min. Generous because a hung pull should fail
    # loudly, not eat the budget.
    timeout-minutes: 45

    steps:
      # Same arithmetic as the verify job: the runner ships with ~14 GB free,
      # and the image plus the volume copy of its `.lake` need roughly 25 GB.
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          echo "free before:${before} after:$(df --output=avail -BG / | tail -1)"
          df -h /

      # The checkout supplies `scripts/container.sh` and the source tree the
      # module list is computed from; the proofs being checked come from the
      # image.
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printenv REGISTRY_TOKEN \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      # The digest in the log records exactly which image this run's claim is
      # about — an anchor of unclear provenance is worth nothing at tier 1.
      - name: Pull the verified image
        run: |
          set -euo pipefail
          if ! docker pull "${IMAGE_BASE}-verified:latest"; then
            echo "::error::cannot pull ${IMAGE_BASE}-verified:latest — run the" \
                 "publish-images workflow first, and check the package is" \
                 "readable by this repository."
            exit 1
          fi
          docker tag "${IMAGE_BASE}-verified:latest" cadence-verified
          docker image inspect cadence-verified \
            --format 'pulled {{index .RepoDigests 0}}'

      # LEAN_NUM_THREADS=3, not the script's default 4: leanchecker peaks at
      # ~12.9 GB with 4 worker threads (measured — scripts/container.sh has
      # the numbers), which leaves no headroom under a 13 GB container limit
      # on this 16 GB runner. Three threads trades a couple of minutes — free,
      # since this job is off the critical path — for not being OOM-flaky.
      - name: Kernel-replay the stored proofs
        env:
          RUNTIME: docker
          CPUS: '4'
          MEMORY: 13G
          LEAN_NUM_THREADS: '3'
        run: |
          set -euo pipefail
          scripts/container.sh check 2>&1 | tee check.log

      # Defence in depth, mirroring the verify job: the script exits non-zero
      # on failure, but a gate should also assert the positive signal it
      # exists to produce.
      - name: Assert the kernel replay
        run: |
          set -euo pipefail
          grep -q 'every stored declaration re-checked by the kernel' check.log

      - name: Upload the check log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-log-${{ github.run_id }}
          path: check.log
          retention-days: 14
