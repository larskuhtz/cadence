# Publish the container images to GHCR.
#
# Two paths, because the halves of the image stack change at very different
# rates and cost very different amounts to rebuild:
#
#   deps     — the whole dependency tree (Mathlib, Loom, lean-smt, cvc5, Veil).
#              Its only inputs are lakefile.lean, lake-manifest.json,
#              lean-toolchain and the Containerfile. Rebuilt only when one of
#              those changes, or on request.
#   verified — this project, built and verified *inside* the image, layered onto
#              the published `deps` image **pinned by digest** (the DEPS_IMAGE
#              ARG in the Containerfile) so the two always share their base
#              layers. Rebuilt on every push to the default branch.
#
# The `verified` stage runs scripts/revalidate.sh during the build, so a failed
# verification condition fails the image build: a published `verified` image is
# always one that printed ALL STAGES GREEN.
#
# Bootstrap: the first run must be a workflow_dispatch with `rebuild_deps:
# true`, and its `verified` build takes the slow path (cvc5 solves every
# verification condition) because there is no published proof cache to seed
# from yet. Every later run seeds from the previous `verified-cache` image.
name: publish-images

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: 'Rebuild and republish the deps/dev images too'
        type: boolean
        default: false

permissions:
  contents: read

# Never publish two image sets at once: the second would race the first's tags.
# Queue rather than cancel — a half-finished push is worse than a wait.
concurrency:
  group: publish-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cadence
  DOCKER_BUILDKIT: '1'          # the verified stage needs RUN --mount

# Architecture: each half is built natively for linux/arm64 and linux/amd64 by
# a two-leg matrix — `ubuntu-24.04-arm` (matching a local build on Apple
# Silicon) and `ubuntu-24.04` — because an x86 stage cannot be layered onto an
# arm64 base, and a cross-build under qemu makes Lean elaboration 10–20×
# slower than native. The legs push arch-suffixed tags (`:latest-arm64`,
# `:latest-amd64`); the final `combine` job assembles each pair into the
# `:latest` manifest list consumers actually pull. Everything that must be
# per-architecture — the DEPS_IMAGE digest pin, the layer-sharing assertion,
# the provenance attestations — happens inside a leg against that leg's own
# arch-suffixed tag; nothing ever pins the manifest list.

jobs:
  # Decide whether the expensive half has to run at all.
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      deps: ${{ steps.decide.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether deps must be rebuilt
        id: decide
        env:
          # Event data is read through the environment, never interpolated into
          # the script body, so crafted event data cannot inject shell.
          REQUESTED: ${{ inputs.rebuild_deps }}
        run: |
          set -euo pipefail
          if [ "${REQUESTED:-}" = true ]; then
            echo 'deps=true' >> "$GITHUB_OUTPUT"
            echo 'deps rebuild requested'
            exit 0
          fi
          # This job only runs on the default branch or on dispatch, so the
          # previous commit is the previously published state.
          if git rev-parse HEAD~1 >/dev/null 2>&1 && \
             git diff --name-only HEAD~1 HEAD -- \
               lakefile.lean lake-manifest.json lean-toolchain Containerfile \
             | grep -q .; then
            echo 'deps=true' >> "$GITHUB_OUTPUT"
            echo 'dependency-defining files changed'
          else
            echo 'deps=false' >> "$GITHUB_OUTPUT"
            echo 'deps unchanged — reusing the published image'
          fi

  build-deps:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    strategy:
      # One architecture failing must not cancel the other mid-push. Nothing
      # inconsistent gets published either way: `combine` below needs every
      # leg, so a half-failed run never moves a `:latest` list.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    # The dependency elaboration is the heaviest thing in the project. Give it
    # room, but not the 6 h cap: if it is not done by now it is stuck.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
      id-token: write          # OIDC, for build provenance
      attestations: write
    steps:
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printenv REGISTRY_TOKEN \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      # Both targets from one Containerfile state, in one step, so `dev` shares
      # every `deps` layer — docs/Container.md § "What actually crosses the
      # wire".
      - name: Build deps and dev
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build --file Containerfile \
            --target deps --tag "${IMAGE_BASE}-deps:latest-${ARCH}" .
          docker build --file Containerfile \
            --target dev  --tag "${IMAGE_BASE}-dev:latest-${ARCH}"  .

      - name: Push, and record the deps digest
        id: push
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_BASE}-deps:latest-${ARCH}"
          docker push "${IMAGE_BASE}-dev:latest-${ARCH}"
          digest=$(docker image inspect "${IMAGE_BASE}-deps:latest-${ARCH}" \
                     --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "deps (${ARCH}) published at $digest"

      # Artifact attestations are available on Free/Pro/Team plans only for
      # PUBLIC repositories; a private repo needs GitHub Enterprise Cloud. Skip
      # rather than fail a job that has already built and pushed its images —
      # this starts working by itself if the repository is made public.
      - name: Attest build provenance (deps)
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}-deps
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-project:
    needs: [changes, build-deps]
    # `always()` is required because a *skipped* dependency would otherwise skip
    # this job too; the guards keep it from layering onto a failed deps build
    # (with a matrix, `failure` means any leg failed).
    if: >-
      always()
      && needs.build-deps.result != 'failure'
      && needs.build-deps.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            other: amd64
            runner: ubuntu-24.04-arm
          - arch: amd64
            other: arm64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printenv REGISTRY_TOKEN \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      # Pin the base by digest, and pull it here so the layer-sharing assertion
      # below can compare against the very image that was published. The digest
      # is resolved from this leg's arch-suffixed tag rather than handed over
      # from build-deps: matrix legs overwrite one another's job outputs (a
      # known Actions wart), and the workflow-level concurrency group already
      # guarantees no other run can move the tag mid-run. `latest-<arch>` is a
      # plain per-arch manifest, so the digest recorded here is exactly the
      # per-architecture manifest — never the `:latest` list.
      - name: Resolve and fetch the deps base image
        id: base
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if ! docker pull "${IMAGE_BASE}-deps:latest-${ARCH}"; then
            # 'manifest unknown' here means the registry was never
            # bootstrapped for this architecture: nothing has published a
            # deps image under this tag, so there is nothing to layer onto
            # and this job cannot succeed.
            echo "::error::cannot pull ${IMAGE_BASE}-deps:latest-${ARCH} —" \
                 "the registry holds no published deps image for ${ARCH}." \
                 "Bootstrap it: dispatch this workflow with rebuild_deps:" \
                 "true, or push a local build (docs/Container.md § 'Seeding" \
                 "the registry from a local build')."
            exit 1
          fi
          digest=$(docker image inspect "${IMAGE_BASE}-deps:latest-${ARCH}" \
                     --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          ref="${IMAGE_BASE}-deps@sha256:${digest#sha256:}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "building on $ref"

      # The proof cache ships inside the previously published `verified-cache`
      # image, so it seeds itself from run to run with no dependency on the
      # Actions cache (10 GB per repository, evicted after a week). The cache
      # is architecture-portable — its key is the closed goal statement, and
      # the goals are identical on both architectures — so a leg whose own
      # arch has no published cache yet borrows the other's (pulling a
      # foreign-arch image is fine here: its files are extracted, never
      # executed). Best effort: on the first run there is nothing to copy and
      # the build falls back to solving every verification condition.
      - name: Seed the proof cache from the last published image
        env:
          ARCH: ${{ matrix.arch }}
          OTHER: ${{ matrix.other }}
        run: |
          set -euo pipefail
          src=""
          for a in "$ARCH" "$OTHER"; do
            if docker pull "${IMAGE_BASE}-verified-cache:latest-${a}"; then
              src="${IMAGE_BASE}-verified-cache:latest-${a}"
              break
            fi
          done
          if [ -n "$src" ]; then
            c=$(docker create "$src")
            trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
            docker cp "$c:/workspaces/cadence/.lake/build/veilcache/." \
                      .veilcache-seed/ || true
            n=$(find .veilcache-seed -type f ! -name .keep | wc -l)
            echo "seeded $n cache entries from $src"
            # A silently empty seed turns an 11-minute build into a 90-minute
            # one. Say so rather than leaving it to be inferred from the timing.
            [ "$n" -gt 0 ] || echo "::warning::the published cache image held no entries"
          else
            echo "::notice::no published verified-cache yet — this build solves every VC"
          fi

      - name: Build verified and verified-cache
        env:
          DEPS_REF: ${{ steps.base.outputs.ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build --file Containerfile --target verified \
            --build-arg "DEPS_IMAGE=${DEPS_REF}" \
            --tag "${IMAGE_BASE}-verified:latest-${ARCH}" .
          docker build --file Containerfile --target verified-cache \
            --build-arg "DEPS_IMAGE=${DEPS_REF}" \
            --tag "${IMAGE_BASE}-verified-cache:latest-${ARCH}" .

      # The point of pinning the base by digest: assert that what is about to be
      # published really does share every layer of the published deps, so an
      # auditor holding deps pulls ~251 MiB rather than ~3 GiB. Nothing else
      # would catch a regression here — both images work either way.
      - name: Assert layer sharing with the published deps
        env:
          DEPS_REF: ${{ steps.base.outputs.ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker image inspect "$DEPS_REF" \
            --format '{{range .RootFS.Layers}}{{println .}}{{end}}' > deps.layers
          docker image inspect "${IMAGE_BASE}-verified:latest-${ARCH}" \
            --format '{{range .RootFS.Layers}}{{println .}}{{end}}' > verified.layers
          n=$(grep -c . deps.layers)
          if ! diff <(grep . deps.layers) <(grep . verified.layers | head -n "$n"); then
            echo "::error::verified does not share the published deps base layers"
            exit 1
          fi
          echo "verified shares all $n deps layers"

      - name: Push
        id: push
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_BASE}-verified:latest-${ARCH}"
          docker push "${IMAGE_BASE}-verified-cache:latest-${ARCH}"
          v=$(docker image inspect "${IMAGE_BASE}-verified:latest-${ARCH}" \
                --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          vc=$(docker image inspect "${IMAGE_BASE}-verified-cache:latest-${ARCH}" \
                --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          # Output names avoid '-': an expression context cannot address a
          # hyphenated key with dot syntax.
          echo "verified_digest=$v"        >> "$GITHUB_OUTPUT"
          echo "verified_cache_digest=$vc" >> "$GITHUB_OUTPUT"
          echo "verified (${ARCH}) published at $v"
          echo "verified-cache (${ARCH}) published at $vc"

      - name: Attest build provenance (verified)
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}-verified
          subject-digest: ${{ steps.push.outputs.verified_digest }}
          push-to-registry: true

      - name: Attest build provenance (verified-cache)
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}-verified-cache
          subject-digest: ${{ steps.push.outputs.verified_cache_digest }}
          push-to-registry: true

  # Assemble the `:latest` manifest lists consumers actually pull. Runs only
  # when every build-project leg succeeded, and covers all four images
  # unconditionally: `imagetools create` is a server-side operation on
  # manifests already in the registry, recreating an unchanged list is a
  # no-op with the same digest, and doing all four keeps every `:latest`
  # pointing at a both-arch list even on runs where the deps half was reused
  # rather than rebuilt.
  combine:
    needs: [changes, build-project]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printenv REGISTRY_TOKEN \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Create the multi-arch manifest lists
        run: |
          set -euo pipefail
          for t in deps dev verified verified-cache; do
            docker buildx imagetools create \
              -t "${IMAGE_BASE}-${t}:latest" \
                 "${IMAGE_BASE}-${t}:latest-arm64" \
                 "${IMAGE_BASE}-${t}:latest-amd64"
            digest=$(docker buildx imagetools inspect \
                       "${IMAGE_BASE}-${t}:latest" --format '{{.Manifest.Digest}}')
            echo "${t}:latest -> ${digest}"
          done
